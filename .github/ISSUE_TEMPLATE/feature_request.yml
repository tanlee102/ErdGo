name: Feature request
description: Suggest an improvement that fits ERD Go's local-first scope
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find the same request.
          required: true
        - label: This proposal preserves ERD Go's local-first, browser-only privacy boundary.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the experience you would like, including relevant SQL dialects.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches or workarounds have you tried?
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add mockups, examples, or related links. Do not include sensitive data.
