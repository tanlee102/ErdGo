<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
        <meta name="theme-color" content="#667eea" />
        <meta name="description" content="ERD Go is a local-first SQL to ERD editor with Data View and Query View." />
        <meta name="robots" content="index, follow" />
        <link rel="icon" href="/favicon.ico" sizes="any" />
        <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
        <link rel="icon" type="image/png" sizes="192x192" href="/web-app-manifest-192x192.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
        <link rel="shortcut icon" href="/favicon.ico" />
        <link rel="manifest" href="/manifest.json" />
        <title>ERD Go — Local-first SQL to ERD Editor</title>
        <script>
            (function () {
                try {
                    var savedTheme = window.localStorage.getItem('erdgo:theme');
                    var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                    var theme = savedTheme === 'dark' || (!savedTheme && prefersDark) ? 'dark' : 'light';
                    document.documentElement.className = theme + '-theme';
                    document.documentElement.style.colorScheme = theme;
                } catch (_error) {
                    document.documentElement.className = 'light-theme';
                }
            })();
        </script>
        <style>
            html, body, #root { min-height: 100%; margin: 0; background: #fff; }
            html.dark-theme, html.dark-theme body, html.dark-theme #root { background: #0a0a0f; }
        </style>
    </head>
    <body>
        <div id="root"></div>
        <noscript>JavaScript is required to run ERD Go.</noscript>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
