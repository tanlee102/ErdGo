        <script>
            (function () {
                try {
                    var savedTheme = window.localStorage.getItem('erdgo:theme');
                    var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                    var theme = savedTheme === 'dark' || (!savedTheme && prefersDark) ? 'dark' : 'light';
                    document.documentElement.className = theme + '-theme';
                    document.documentElement.style.colorScheme = theme;
                } catch (_error) {
                    document.documentElement.className = 'light-theme';
                }
            })();
        </script>
        <style>
            html, body, #root { min-height: 100%; margin: 0; background: #fff; }
            html.dark-theme, html.dark-theme body, html.dark-theme #root { background: #0a0a0f; }
        </style>
    </head>
    <body>
        <div id="root"></div>
        <noscript>JavaScript is required to run ERD Go.</noscript>
